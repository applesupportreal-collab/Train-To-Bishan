<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Train to Bishan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,0,0"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Creepster&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-frame" aria-live="polite">
      <span
        class="device-indicator material-symbols-rounded"
        id="deviceIndicator"
        aria-label="Mobile device"
      >
        smartphone
      </span>
      <div class="status-text" id="statusText" aria-live="polite" hidden></div>
      <div class="sleep-dim" id="sleepDim" aria-hidden="true"></div>

      <section class="start-screen" id="startScreen" aria-label="Train to Bishan main screen">
        <div class="title-lockup">
          <span class="line-code">NSL</span>
          <h1>Train to Bishan</h1>
          <p>City Hall to Bishan station</p>
        </div>

        <button class="primary" id="startButton" type="button">Start commute</button>
      </section>

      <section class="game screen" id="playScreen" aria-label="Train to Bishan game" hidden>
        <div class="scene" aria-label="City Hall MRT platform">
        <div class="station-sign">
          <span class="line-code">NS25</span>
          <span>City Hall</span>
        </div>

        <div class="train" id="train">
          <div class="train-light"></div>
          <div class="train-car">
            <div class="window"></div>
            <div class="door left"></div>
            <div class="door right"></div>
            <div class="window small"></div>
          </div>
        </div>

        <div class="platform-line"></div>
        <div class="queue" id="queue">
          <span class="commuter player"></span>
          <span class="commuter bag"></span>
          <span class="commuter cap"></span>
          <span class="commuter"></span>
          <span class="commuter tote"></span>
        </div>

        <div class="train-interior" id="trainInterior" aria-hidden="true" hidden></div>
        <div class="auntie-event" id="auntieEvent" aria-hidden="true" hidden>
          <img id="auntieImage" src="assets/auntie-placeholder.svg" alt="" />
        </div>
        </div>

        <div class="hud">
        <div class="station-segment" id="stationSegment" aria-label="Current and next station">
          <span id="currentStationName">City Hall</span>
          <div class="segment-track">
            <span id="segmentProgress"></span>
          </div>
          <span id="nextStationName">Dhoby Ghaut</span>
        </div>

        <div class="meters" id="meters">
          <div class="meter" id="primaryMeter">
            <span id="primaryLabel">Boarding</span>
            <strong id="primaryTimer">00:08</strong>
          </div>
        </div>

        <div class="status-ribbon" id="statusRibbon">Platform queue forming</div>

        <p class="message" id="message">Tap start when you are at the platform.</p>

        <button class="sensor-fallback" id="sensorFallback" type="button" hidden>
          Simulated upright
        </button>

        <div class="actions">
          <button class="primary action-button" id="actionButton" type="button" disabled>
            Waiting
          </button>
        </div>
        </div>
      </section>

      <section class="success-screen screen" id="successScreen" aria-label="Bishan arrival success screen" hidden>
        <div class="confetti" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="success-copy">
          <span class="line-code">NS17</span>
          <h2>You Survived Train to Bishan!</h2>
          <p id="successMessage">You made it to Bishan station.</p>
        </div>

        <button class="primary" id="successRestartButton" type="button">Play again</button>
      </section>
    </main>

    <script src="config/game-config.js"></script>
    <script src="sounds/playlist.js"></script>
    <script src="app.js"></script>
  </body>
</html>
